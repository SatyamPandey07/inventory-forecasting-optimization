name: InventoryAI CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-python-engine:
    name: Test Python Forecasting & Optimization Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          cd forecasting-engine
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run Pytest Suite
        run: |
          cd forecasting-engine
          pytest tests/

  test-node-gateway:
    name: Test & Build Node.js Express Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies & Build TypeScript
        run: |
          cd backend-api
          npm ci
          npm run build

  build-nextjs-frontend:
    name: Build Next.js React Dashboard UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & Build Next.js Production App
        run: |
          cd frontend
          npm ci
          npm run build

  docker-compose-validation:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker Compose Build
        run: |
          docker compose -f infra/docker-compose.yml config
